name: Daily Stock Picks
on:
  schedule:
    - cron: '0 2 * * 1-5'   # 02:00 UTC ≈ 07:30 IST, weekdays only
  workflow_dispatch:         # allow manual runs from GitHub UI

jobs:
  run-picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Generate picks and send email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python jobs/daily_picks.py

      - name: Commit picks to repo
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest_picks.json
          git commit -m "Picks $(date -u +%F)" || echo "no changes"
          git push
